name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Updated to v4

    - name: Set up Python
      uses: actions/setup-python@v5 # Updated to v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests beautifulsoup4 undetected-chromedriver setuptools

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name="FitGirl_FF_Link_Extractor" ff_grabber.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4 # Updated to v4
      with:
        name: FitGirl_FF_Link_Extractor-Windows
        path: dist/FitGirl_FF_Link_Extractor.exe